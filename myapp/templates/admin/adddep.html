{% extends 'admin/adminlayout.html' %} 

{% block admin %}

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  .text {
    color: #7c8aa8;
  }

  .section-card {
    background: #fff;
    border: 1px solid #dbe7df;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 16px 36px rgba(8, 112, 58, 0.07);
  }

  .form {
    height: 46px;
    width: 100%;
  }

  .btn-main {
    height: 44px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #1d4ed8, #102f76);
    color: #fff;
    font-weight: 800;
    padding: 0 18px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-back {
    border-radius: 9px;
    background: #e7f4ec;
    color: #1d4ed8;
    font-weight: 800;
    text-decoration: none;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    height: 44px;
  }
</style>

<div class="container-fluid px-3 px-md-4 mb-5">
  <div class="row">
    <div class="col-12">
      <h2 class="fw-bolder mt-4">Add Department</h2>
      <p class="text">Create or update department details</p>
    </div>

    <div class="col-12 mt-2">
      <div class="section-card">
        <h4 class="fw-bolder mb-4">Department Information</h4>

        {% for i in messages %}
        <div class="alert {% if i.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
          {{ i }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}

        <form action="{% url 'dep_save' %}" method="post">
          {% csrf_token %}

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="Ename" class="fw-bold mb-2">Department Name <span class="text-danger">*</span></label>
              <input
                type="text"
                name="dep_name"
                class="form-control form"
                id="Ename"
                placeholder="Enter Department Name"
                required
              />
            </div>

            <div class="col-12 col-md-6">
              <label for="Mname" class="fw-bold mb-2">Department Code <span class="text-danger">*</span></label>
              <input
                type="text"
                name="dep_code"
                class="form-control form"
                id="Mname"
                placeholder="e.g. IT, HR, FIN"
                required
              />
            </div>

            <div class="col-12 col-md-6">
              <label for="priority" class="fw-bold mb-2">Department Head <span class="text-danger">*</span></label>
              <input
                type="text"
                name="dep_head"
                class="form-control form"
                id="priority"
                placeholder="Enter Department Head Name"
                required
              />
            </div>

            <div class="col-12 col-md-6">
              <label for="attach1" class="fw-bold mb-2">Status <span class="text-danger">*</span></label>
              <select name="status" id="attach1" class="form-control form" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label for="move" class="fw-bold mb-2">Department Email <span class="text-danger">*</span></label>
              <input
                type="email"
                name="dep_email"
                class="form-control form"
                id="move"
                placeholder="department@ggl.com"
                required
              />
            </div>

            <div class="col-12 col-md-6">
              <label for="phot" class="fw-bold mb-2">Contact Number <span class="text-danger">*</span></label>
              <input
                type="tel"
                name="dep_number"
                class="form-control form"
                id="phot"
                placeholder="10-digit contact number"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                required
              />
            </div>

            <div class="col-12">
              <label for="text3" class="fw-bold mb-2">Description</label>
              <textarea
                name="description"
                rows="3"
                class="form-control"
                id="text3"
                placeholder="Enter department description or notes..."
              ></textarea>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn-main">
              <i class="fa-solid fa-floppy-disk me-2"></i>Save Department
            </button>
            <a href="{% url 'managedep' %}" class="btn-back">Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
