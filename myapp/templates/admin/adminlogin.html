<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Green Gas Limited | File Tracking System</title>

    <!-- Bootstrap (layout + components) and Font Awesome (icons) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        background:
          linear-gradient(
            135deg,
            rgba(18, 41, 90, 0.94),
            rgba(29, 78, 216, 0.9)
          ),
          url(https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=80);
      }
      .box1 img {
        width: 92px;
        background: #fff;
        padding: 8px;
        border-radius: 12px;
        margin-bottom: 12px;
      }

      .info-panel {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border-radius: 16px 0 0 16px;
        padding: 3rem;
      }
      .form-panel {
        background: #fff;
        border-radius: 0 16px 16px 0;
        padding: 3rem;
      }
      .btn-login {
        background: #1d4ed8;
        color: #fff;
        border-radius: 10px;
        padding: 0.75rem;
        font-weight: 600;
      }
      .btn-login:hover {
        background: #0b2559;
        color: #fff;
      }
      .footer-text {
        margin-top: 26px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
      }
      @media (max-width: 991.98px) {
        .info-panel {
          border-radius: 16px 16px 0 0;
        }
        .form-panel {
          border-radius: 0 0 16px 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
          <div class="row g-0 shadow-lg">
            <div class="col-lg-6 info-panel">
              <div class="box1">
                <img src="https://gglengage.com/images/ggllogo.png" alt="" />
              </div>
              <h1 class="fw-bold">Admin Login</h1>
              <p>
                Admin can manage employees, departments, file records, tracking
                and movement workflow
              </p>
            </div>

            <div class="col-lg-6 form-panel">
              <span class="badge text-success bg-primary-subtle mb-3 fw-bold"
                >Green Gas Limited</span
              >
              <h2 class="fw-bold">Welcome Admin</h2>
              <p class="text-secondary mb-4">
                Enter admin credentials to access dashboard.
              </p>
              {% for mess in messages %}
              <div class="alert alert-danger" role="alert">
                {{mess}}
              </div>
              {% endfor %}
              <form action="{% url 'loginsave' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                  <label class="form-label fw-semibold"
                    >Admin Username / Email</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fa-solid fa-user"></i
                    ></span>
                    <input
                      type="text"
                      name="username"
                      class="form-control"
                      placeholder=" "
                      required="True"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-semibold">Password</label>
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fa-solid fa-lock"></i
                    ></span>
                    <input
                      type="password"
                      name="password"
                      class="form-control"
                      placeholder=""
                      required
                    />
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                ></div>

                <button type="submit" class="btn btn-login w-100">Login</button>
              </form>

              <a
                href="#"
                class="d-inline-block mt-3 text-secondary text-decoration-none"
              >
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Portal
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
