{% extends 'admin/adminlayout.html' %} {% block admin %}

<div class="container-fluid px-3 px-md-4 my-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0 fw-bold">Edit File</h4>
    </div>

    <div class="card-body p-3 p-md-4">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-bold">File No</label>
          <input
            type="text"
            class="form-control"
            value="{{ obj.file_no }}"
            readonly
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Subject</label>
          <input
            type="text"
            name="subject"
            class="form-control"
            value="{{ obj.subject }}"
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Priority</label>
          <select name="priority" class="form-control">
            <option value="Low" {% if obj.priority == "Low" %}selected{% endif %}>Low</option>
            <option value="Medium" {% if obj.priority == "Medium" %}selected{% endif %}>Medium</option>
            <option value="High" {% if obj.priority == "High" %}selected{% endif %}>High</option>
            <option value="Urgent" {% if obj.priority == "Urgent" %}selected{% endif %}>Urgent</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Department</label>
          <input
            type="text"
            name="department"
            value="{{ obj.department }}"
            class="form-control"
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea name="description" class="form-control" rows="4">{{ obj.description }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Current File</label>
          <div>
            {% if obj.file %}
            <a href="{{ obj.file.url }}" target="_blank" class="btn btn-sm btn-outline-primary">
              <i class="fa-solid fa-file me-1"></i> View Uploaded File
            </a>
            {% else %}
            <span class="text-danger">No File Uploaded</span>
            {% endif %}
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Upload New File</label>
          <input type="file" name="file" class="form-control" />
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-success fw-bold px-4">
            <i class="fa-solid fa-floppy-disk me-1"></i> Update File
          </button>
          <a href="{% url 'sentfiles' %}" class="btn btn-secondary px-3"> Back </a>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
