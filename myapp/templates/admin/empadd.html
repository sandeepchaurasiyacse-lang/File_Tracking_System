{% extends 'admin/adminlayout.html' %} {% block admin %}

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  .text {
    color: #7c8aa8;
  }

  .section-card {
    background: #fff;
    border: 1px solid #dbe7df;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 16px 36px rgba(8, 112, 58, 0.07);
  }

  .form {
    height: 50px;
    width: 510px;
    {% comment %} border: 1px solid black; {% endcomment %}
  }
  .btn-main {
    height: 44px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #1d4ed8, #102f76);
    color: #fff;
    font-weight: 800;
    padding: 0 18px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-back{
    border-radius: 9px;
    background: #e7f4ec;
    color: #1d4ed8;
    font-weight: 800;
    text-decoration: none;
    padding: 8px 12px;
  }
</style>

<div class="container-fluid px-4 mb-5">
  <div class="row">
    <div class="col-12">
      <h2 class="fw-bolder mt-4">Add Employee</h2>
      <p class="text">
        Add or update employee details. Role is static: Admin or User.
      </p>
    </div>

    <div class="col-12 mt-2">
      <div class="section-card">
        <h4 class="fw-bolder mb-4">Employee Information</h4>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="row g-3">
            {% for i in messages %}
            <div class="alert alert-success" role="alert">{{i}}</div>
            {% endfor %}
            <div class="col-sm-6">
              <label for="Ename" class="fw-bold mb-2">Full Name</label>
              <input
                type="text"
                name="name"
                class="form-control form"
                id="Ename"
              />
            </div>

            <div class="col-sm-6">
              <label for="Mname" class="fw-bold mb-2">Username</label>
              <input
                type="email"
                name="username"
                class="form-control form"
                id="Mname"
              />
            </div>
            <div class="col-sm-6">
              <label for="priority" class="fw-bold mb-2">Email</label>
              <input
                type="email"
                name="email"
                class="form-control form"
                id="priority"
              />
            </div>

            <div class="col-sm-6">
              <label for="Dname" class="fw-bold mb-2">Mobile</label>
              <input
                type="tel"
                name="mobile"
                class="form-control form"
                id="Dname"
              />
            </div>
            <div class="col-sm-6">
              <label for="move" class="fw-bold mb-2">Employee ID</label>
              <input
                type="text"
                name="emp_id"
                class="form-control form"
                id="move"
              />
            </div>
            <div class="col-sm-6">
              <label for="attach" class="fw-bold mb-2">Department</label>
              <select name="department" id="attach" class="form-control form">
                <option value="">Select Department</option>
                <option value="IT Department">IT Department</option>
                <option value="Administration">Administration</option>
                <option value="">Account Department</option>
                <option value="">HR Department</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="move1" class="fw-bold mb-2">Designation</label>
              <input
                type="text"
                name="disignation"
                class="form-control form"
                id="move1"
              />
            </div>
            <div class="col-sm-6">
              <label for="attach1" class="fw-bold mb-2">Static Role</label>
              <select name="role" id="attach1" class="form-control form">
                <option value="">Select Role</option>
                <option value="Admin">Admin</option>
                <option value="User">User</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="attach2" class="fw-bold mb-2">Status</label>
              <select name="status" id="attach2" class="form-control form">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="move3" class="fw-bold mb-2">Password</label>
              <input
                type="text"
                name="password"
                class="form-control form"
                id="move3"
              />
            </div>
            <div class="col-sm-6">
              <label for="phot" class="fw-bold mb-2">Photo</label><br />
              <input
                type="file"
                name="photo"
                class="form-control form"
                id="phot"
              />
            </div>
            <div class="col-sm-12">
              <label for="text3" class="fw-bold mb-2">Address</label><br />
              <textarea
                name="address"
                rows="5"
                cols="129"
                class="form-control"
                id="text3"
              ></textarea>
            </div>
          </div>
          <button type="submit" class="btn-main mt-4">
            <i class="fa-solid fa-floppy-disk me-2"></i>Save Employee
          </button>
          <a href="#" class="btn-back ms-2">Back</a>
        </form>
        {% endblock %}
      </div>
    </div>
  </div>
</div>
