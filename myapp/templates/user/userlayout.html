<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Green Gas Limited | File Tracking System</title>
    <link rel="icon" type="image/png" href="https://gglengage.com/images/ggllogo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f0fdf4;
        overflow-x: hidden;
      }

      a {
        text-decoration: none;
        color: white;
      }

      /* Sidebar Styling */
      .sidebar {
        background: #fff;
        z-index: 1040;
        transition: transform 0.3s ease-in-out;
      }

      @media (min-width: 992px) {
        .sidebar {
          position: sticky;
          top: 0;
          height: 100vh;
          overflow-y: auto;
          display: block !important;
        }
      }

      @media (max-width: 991.98px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          width: 280px;
          max-width: 85vw;
          height: 100vh;
          overflow-y: auto;
          box-shadow: 4px 0 25px rgba(0, 0, 0, 0.2);
          transform: translateX(-100%);
        }
        .sidebar.show {
          transform: translateX(0);
        }
      }

      .box1 {
        background: linear-gradient(135deg, #08703a, #034a24);
        padding: 24px 20px;
        color: #fff;
      }

      .box1 img {
        width: 92px;
        background: #fff;
        padding: 8px;
        border-radius: 12px;
        margin-bottom: 12px;
      }

      .box1 h5 {
        font-weight: 900;
        margin: 0;
      }

      .box2 {
        padding: 18px 14px;
        background-color: white;
      }

      .menu-title {
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 900;
        color: #7c8aa8;
        margin: 18px 10px 10px;
      }

      .box2 a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        text-decoration: none;
        color: #21365f;
        border-radius: 12px;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.25s ease;
      }

      .box2 a:hover {
        background-color: #f0fdf4;
        color: #08703a;
        transform: translateX(4px);
      }

      .box2 a i {
        width: 20px;
        color: #08703a;
        transition: transform 0.25s ease;
      }

      .box2 a:hover i {
        transform: scale(1.15);
      }

      /* Main Content & Topbar */
      .s {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: linear-gradient(135deg, #08703a, #034a24);
        position: sticky;
        top: 0;
        z-index: 1030;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
        padding: 12px 20px;
      }

      .hamburger-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        border-radius: 8px;
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .hamburger-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      .topbar-title {
        font-size: clamp(1.15rem, 2.5vw, 1.6rem);
        margin: 0;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #fff;
        color: #08703a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 16px;
      }

      .office {
        color: #bbf7d0;
      }

      /* Sidebar Overlay Backdrop for Mobile */
      .sidebar-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1035;
        backdrop-filter: blur(2px);
      }

      .sidebar-backdrop.show {
        display: block;
      }

      /* Responsive Helpers */
      .btn, .btn-main, .main, .main2, .btn-back {
        transition: all 0.25s ease-in-out;
      }

      .btn-main:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(8, 112, 58, 0.35);
      }

      .btn-back:hover {
        background: #dcfce7;
        color: #047857;
        transform: translateY(-1px);
      }

      .card {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      table.table tbody tr:hover {
        background-color: #f0fdf4;
      }

      @media (max-width: 991.98px) {
        .section-card, .section-card3 {
          padding: 16px 14px !important;
          border-radius: 14px !important;
        }
        .section-card2 {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 10px !important;
          margin-bottom: 14px !important;
        }
        .btn-main {
          margin-top: 0 !important;
          width: 100% !important;
          text-align: center !important;
        }
        .welcome-card {
          padding: 18px 14px !important;
          margin-top: 15px !important;
          border-radius: 14px !important;
        }
        .welcome-card h2 {
          font-size: 1.35rem !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="userSidebarBackdrop" onclick="toggleUserSidebar()"></div>

    <div class="container-fluid p-0">
      <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-lg-2 sidebar p-0" id="userSidebar">
          <div class="box1 d-flex justify-content-between align-items-start d-lg-block">
            <div>
              <img src="https://gglengage.com/images/ggllogo.png" alt="GGL Logo" />
              <h5>GGL User</h5>
              <small>File Tracking Dashboard</small>
            </div>
            <button type="button" class="btn-close btn-close-white d-lg-none mt-1" onclick="toggleUserSidebar()" aria-label="Close"></button>
          </div>

          <div class="box2">
            <div class="menu-title">Main</div>

            <a href="{% url 'userdashboard' %}">
              <i class="fa-solid fa-gauge-high"></i>
              User Dashboard
            </a>

            <div class="menu-title">File Management</div>

            <a href="{% url 'ur_upload_files' %}">
              <i class="fa-solid fa-file-circle-plus"></i>
              Upload File
            </a>

            <a href="{% url 'ur_receivedfiles' %}">
              <i class="fa-solid fa-clipboard"></i>
              Received Files
            </a>

            <a href="{% url 'ur_sentfile' %}">
              <i class="fa-solid fa-paper-plane"></i>
              Sent Files
            </a>

            <a href="{% url 'pendingfile' %}">
              <i class="fa-solid fa-clock"></i>
              Pending Files
            </a>

            <a href="{% url 'ur_allfiles' %}">
              <i class="fa-solid fa-folder-open"></i>
              My All Files
            </a>

            <a href="{% url 'trackfile' %}">
              <i class="fa-solid fa-magnifying-glass-location"></i>
              File Track
            </a>

            <div class="menu-title">Account</div>

            <a href="{% url 'userlogout' %}">
              <i class="fa-solid fa-right-from-bracket"></i>
              Logout
            </a>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-12 col-lg-10 s p-0">
          <div class="topbar d-flex align-items-center justify-content-between">
            <!-- Left: Hamburger Button + Title -->
            <div class="d-flex align-items-center gap-2">
              <button class="hamburger-btn d-lg-none" type="button" onclick="toggleUserSidebar()" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars"></i>
              </button>
              <h2 class="text-white fw-bolder topbar-title">User Panel</h2>
            </div>

            <!-- Right: User Info & Avatar -->
            <div class="d-flex align-items-center">
              <div class="text-end me-2 me-md-3">
                <h6 class="office mb-0 fw-bolder d-none d-sm-block">{{ request.session.name }}</h6>
                <small class="admin-text fw-bold text-white">File User</small>
              </div>
              <div class="avatar">{{ request.session.name|first|upper|default:"U" }}</div>
            </div>
          </div>

          <div class="flex-grow-1">
            {% block user %}

            {% endblock %}
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleUserSidebar() {
        var sidebar = document.getElementById('userSidebar');
        var backdrop = document.getElementById('userSidebarBackdrop');
        if (sidebar && backdrop) {
          sidebar.classList.toggle('show');
          backdrop.classList.toggle('show');
        }
      }
    </script>
  </body>
</html>
